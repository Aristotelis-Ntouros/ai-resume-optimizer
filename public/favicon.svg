<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="36" height="36" rx="8" fill="url(#logoGradient)"/>

  <!-- Document icon with checkmark (representing resume matching) -->
  <!-- Document shape -->
  <path d="M13 10 C13 9.5 13.5 9 14 9 L23 9 L27 13 L27 29 C27 29.5 26.5 30 26 30 L14 30 C13.5 30 13 29.5 13 29 Z"
        fill="white" opacity="0.95"/>

  <!-- Document fold -->
  <path d="M23 9 L23 13 L27 13" fill="none" stroke="white" stroke-width="1" opacity="0.7"/>

  <!-- Checkmark -->
  <path d="M16.5 20 L18.5 22 L23.5 17"
        fill="none"
        stroke="url(#logoGradient)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small "AI" badge -->
  <circle cx="25" cy="25" r="4.5" fill="#10b981"/>
  <text x="25" y="27"
        font-family="Arial, sans-serif"
        font-size="5"
        font-weight="700"
        fill="white"
        text-anchor="middle">AI</text>
</svg>
